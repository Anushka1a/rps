<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="rps.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button type="button" onclick="playGame('Rock')">
        <img class="options" src="rock.png" alt="Rock">
    </button>
    <button type="button" onclick="playGame('Paper')">
        <img class="options" src="paper.png" alt="Paper">
    </button>
    <button type="button" onclick="playGame('Scissors')">
        <img class="options" src="scissors.png" alt="Scissors">
    </button>
    <button type="button" onclick="resetGame()">
        <img class="options" src="reset.jpg" alt="Reset game">
    </button>

    <h2>Game Summary</h2>
    <table>
        <tr>
            <th>Wins</th>
            <th>Losses</th>
            <th>Ties</th>
            <th>Games Played</th>
        </tr>
        <tr>
            <td id = "wins">0</td>
            <td id = "losses">0</td>
            <td id = "ties"> 0</td>
            <td id = "gamesPlayed">0</td>
        </tr>
    </table>

    <h2>Game History</h2>
    <table id="gameHistory">
        <tr>
            <th>#</th>
            <th>User Move</th>
            <th>Computer Move</th>
            <th>Result</th>
        </tr>
    </table>
    <script src="rps.js"></script>
</body>
</html>
